# PersistentVolumeClaim para ficheiros GPX
# Permite acesso ReadWriteMany (RWX) para múltiplos pods
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-gpx
  namespace: grupo1
spec:
  accessModes:
    - ReadWriteOnce        # Compatível com StorageClass standard do kind (para deploy local)
  resources:
    requests:
      storage: 1Gi
  # opcional: especificar storageClassName se o cluster exigir
  # storageClassName: nfs-storage
