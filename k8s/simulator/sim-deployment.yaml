apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: grupo1
  labels:
    app: simulator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: vitorremesso/simulator:8a0487a
          ports:
            - containerPort: 8080
              name: metrics
          env:
            - name: RABBIT_USER
              valueFrom: 
                secretKeyRef:
                  name: rabbitmq-auth
                  key: username
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: password
            - name: RABBIT_URL
              value: amqp://$(RABBIT_USER):$(RABBIT_PASS)@rabbitmq-cluster.rabbitmq-system.svc.cluster.local:5672/
            - name: RABBIT_EXCHANGE
              value: events
            - name: RABBIT_ROUTING_KEY
              value: gps.update
            - name: GPX_FOLDER
              value: /app/gpx-files
            - name: SIM_PUBLISH_INTERVAL
              value: "0.5"
          volumeMounts:
            - name: gpx-volume
              mountPath: /app/gpx-files
              readOnly: true
          resources:
            requests:
              cpu: "12m"
              memory: "64Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["python", "-c", "print('ok')"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["python", "-c", "print('ok')"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: gpx-volume
          persistentVolumeClaim:
            claimName: pvc-gpx
# Deployment do simulador de atletas
# Utiliza variáveis de ambiente seguras via Secret
# Volume para ficheiro GPX via PVC
# Limites de recursos e probes definidos
