apiVersion: v1
kind: Service
metadata:
  name: simulator-metrics
  namespace: grupo1
  labels:
    app: simulator
spec:
  selector:
    app: simulator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simulator-monitor
  namespace: monitoring # <-- namespace do Prometheus!
  labels:
    app: simulator
spec:
  selector:
    matchLabels:
      app: simulator
  namespaceSelector:
    matchNames:
      - grupo1
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s