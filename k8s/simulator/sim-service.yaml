apiVersion: v1
kind: Service
metadata:
  name: simulator
  namespace: grupo1
  labels:
    app: simulator
spec:
  type: NodePort
  selector:
    app: simulator
  ports:
    - name: metrics-sim
      port: 8080
      targetPort: 8080
      protocol: TCP
      nodePort: 30091
# Service para expor o simulator dentro do cluster
# Porta 8080 para comunicação interna