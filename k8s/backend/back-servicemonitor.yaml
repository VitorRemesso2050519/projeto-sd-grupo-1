apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: grupo1
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: metrics-backend
      port: 8000
      targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: grupo1
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - grupo1
  endpoints:
    - port: metrics-backend
      path: /metrics
      interval: 15s
    