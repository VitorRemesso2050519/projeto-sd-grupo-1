
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simulator-monitor
  namespace: monitoring
  labels:
    app: simulator
spec:
  selector:
    matchLabels:
      app: simulator
  namespaceSelector:
    matchNames:
      - grupo1
  endpoints:
    - port: 8080
      path: /metrics
      interval: 15s