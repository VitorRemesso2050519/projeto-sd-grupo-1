apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grupo1-simulator-monitor
  labels:
    release: kube-prometheus-stack
    namespace: monitoring
spec:
  selector:
    matchLabels:
      app: simulator
  namespaceSelector:
    matchNames:
      - grupo1
  endpoints:
    - port: metrics-sim
      path: /metrics
      interval: 15s